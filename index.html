<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinguaReader: read real books in the language you're learning</title>
    <meta name="description" content="A free, open source reader for language learners. Open PDFs, EPUBs, comics and scans, select a word to translate and save it, and review it with spaced repetition. For Windows, macOS and Linux." />
    <meta property="og:title" content="LinguaReader" />
    <meta property="og:description" content="Read real books in the language you're learning. Select a word to translate it, save it, and review it before you forget it." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.png" />
    <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
    <script>
      // Set the theme before the page paints: the saved choice, else the system setting.
      (function () {
        var t = null;
        try { t = localStorage.getItem('lr-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
